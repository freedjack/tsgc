      # Map extensionless top-level routes to their .php counterparts
      location ~ ^/([A-Za-z0-9\-_]+)/?$ {
        try_files $uri /$1.php?$args;
      }

      # Map knowledge articles to .php files within the knowledge directory
      location ~ ^/(knowledge)/([A-Za-z0-9\-_]+)/?$ {
        try_files $uri /$1/$2.php?$args;
      }

      # Fallback: keep default Valet behavior for everything else
      location / {
        try_files $uri $uri/ $uri.php?$args;
      }